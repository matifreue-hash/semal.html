<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin - Perfumes Ciro</title>


<style>

*{
box-sizing:border-box;
font-family:Arial, Helvetica, sans-serif;
}


body{

background:#080808;
color:white;
padding:40px;

}



h1{

color:#d4af37;
text-align:center;

}



.panel{

max-width:600px;
margin:auto;
background:#151515;
padding:30px;
border-radius:20px;

}



input{

width:100%;
padding:12px;
margin:10px 0;
border-radius:10px;
border:none;

}



button{

background:#d4af37;
border:none;
padding:12px 25px;
border-radius:20px;
cursor:pointer;
font-weight:bold;

}



.producto{

background:#222;
padding:20px;
margin:20px 0;
border-radius:15px;

}



#admin{

display:none;

}


</style>


</head>



<body>


<h1>
PERFUMES CIRO ADMIN
</h1>




<div class="panel">



<div id="login">


<h2>
Ingresar
</h2>


<input 
type="password"
id="clave"
placeholder="Contraseña">


<button onclick="entrar()">
Entrar
</button>


</div>






<div id="admin">


<h2>
Editar precios
</h2>


<div id="productosAdmin"></div>


</div>



</div>






<script>


const contraseña = "172509";



let perfumes =
JSON.parse(localStorage.getItem("perfumes"))
||
[


{
nombre:"Lattafa Khamrah",
precio:35000
},


{
nombre:"Lattafa Asad",
precio:32000
},


{
nombre:"Yara Lattafa",
precio:30000
},


{
nombre:"Oud For Glory",
precio:42000
},


{
nombre:"Fakhar Black",
precio:31000
}


];





function entrar(){


let clave =
document.getElementById("clave").value;



if(clave === contraseña){


document.getElementById("login")
.style.display="none";


document.getElementById("admin")
.style.display="block";


mostrarEditar();


}

else{


alert("Contraseña incorrecta");


}


}







function mostrarEditar(){


let caja =
document.getElementById("productosAdmin");


caja.innerHTML="";



perfumes.forEach((p,index)=>{


caja.innerHTML += `


<div class="producto">


<h3>
${p.nombre}
</h3>


<input 
id="precio${index}"
value="${p.precio}">


<button onclick="guardarPrecio(${index})">

Guardar

</button>


</div>


`;


});


}







function guardarPrecio(index){


let nuevoPrecio =
document.getElementById(
"precio"+index
).value;



perfumes[index].precio =
Number(nuevoPrecio);



localStorage.setItem(
"perfumes",
JSON.stringify(perfumes)
);



alert("Precio actualizado");


}



</script>



</body>

</html>
