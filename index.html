<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Perfumes Ciro</title>


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">


<style>


*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, Helvetica, sans-serif;
}


body{

background:#080808;
color:white;

}



/* HEADER */


header{

height:90px;

background:#050505;

display:flex;

align-items:center;

justify-content:space-between;

padding:20px 60px;

position:sticky;

top:0;

z-index:1000;

box-shadow:0 0 20px black;

}



.logo{

font-size:35px;

font-weight:bold;

}



.logo span{

color:#d4af37;

}



nav a{

color:white;

text-decoration:none;

margin:15px;

font-size:18px;

}



nav a:hover{

color:#d4af37;

}





/* HERO */


.hero{

height:550px;


background:

linear-gradient(
rgba(0,0,0,.5),
rgba(0,0,0,.9)
),

url("https://images.unsplash.com/photo-1541643600914-78b084683601");


background-size:cover;

background-position:center;

display:flex;

align-items:center;

padding:60px;

}



.hero h1{

font-size:75px;

color:#d4af37;

text-shadow:0 0 25px #d4af37;

}



.hero p{

font-size:25px;

margin-top:25px;

}




/* BUSCADOR */


.buscador{

text-align:center;

padding:40px;

}



.buscador input{

width:60%;

padding:18px;

border-radius:30px;

border:none;

font-size:18px;

}





/* TITULO */


.titulo{

text-align:center;

font-size:45px;

color:#d4af37;

margin:40px;

}




/* PRODUCTOS */


.productos{


display:grid;

grid-template-columns:

repeat(auto-fit,minmax(280px,1fr));


gap:30px;

padding:40px;

}




.card{

background:#151515;

border-radius:20px;

overflow:hidden;

text-align:center;

padding-bottom:25px;

transition:.4s;

}



.card:hover{

transform:translateY(-10px);

box-shadow:0 0 25px #d4af37;

}





.card img{

width:100%;

height:320px;

object-fit:cover;

}





.card h2{

color:#d4af37;

margin:15px;

}



.card p{

color:#ccc;

padding:10px;

}



.precio{

font-size:28px;

color:#00c853;

margin:15px;

}
</style>

</head>


<body>


<header>


<div class="logo">

PERFUMES <span>CIRO</span>

</div>



<nav>

<a href="#">Inicio</a>

<a href="#productos">Perfumes</a>

</nav>


</header>





<section class="hero">


<div>


<h1>

PERFUMES CIRO

</h1>


<p>

Perfumes árabes premium con esencia oriental.

</p>


</div>


</section>






<div class="buscador">


<input 
id="buscar"
placeholder="Buscar perfume...">


</div>






<h2 class="titulo">

Nuestros perfumes

</h2>





<section class="productos" id="productos">


</section>





<footer>


<h2>

PERFUMES CIRO

</h2>


<p>

Perfumes árabes premium

</p>



<div class="redes">


<i class="fa-brands fa-instagram"></i>


<i class="fa-brands fa-whatsapp"></i>


<i class="fa-brands fa-tiktok"></i>


</div>


</footer><style>


footer{

background:#050505;

text-align:center;

padding:50px;

margin-top:60px;

}


footer h2{

color:#d4af37;

}



.redes{

font-size:35px;

display:flex;

justify-content:center;

gap:30px;

margin-top:20px;

}





@media(max-width:700px){


header{

padding:20px;

}



.logo{

font-size:25px;

}



nav{

display:none;

}



.hero{

padding:30px;

}



.hero h1{

font-size:45px;

}



.buscador input{

width:90%;

}



.titulo{

font-size:35px;

}



.card img{

height:280px;

}


}


</style><script>


const perfumes = [


{
nombre:"Lattafa Khamrah",
precio:35000,
imagen:"https://m.media-amazon.com/images/I/61J4LqfM5nL._AC_UF1000,1000_QL80_.jpg",
descripcion:"Vainilla, canela y ámbar. Aroma dulce y elegante."
},



{
nombre:"Lattafa Asad",
precio:32000,
imagen:"https://m.media-amazon.com/images/I/61Yk3vP5Y9L._AC_UF1000,1000_QL80_.jpg",
descripcion:"Perfume intenso con especias y madera."
},



{
nombre:"Yara Lattafa",
precio:30000,
imagen:"https://m.media-amazon.com/images/I/71n7b8HqRGL._AC_UF1000,1000_QL80_.jpg",
descripcion:"Fragancia femenina con notas dulces."
},



{
nombre:"Oud For Glory",
precio:42000,
imagen:"https://m.media-amazon.com/images/I/61kYxQ8X7mL._AC_UF1000,1000_QL80_.jpg",
descripcion:"Aroma oriental con oud y especias."
},



{
nombre:"Fakhar Black",
precio:31000,
imagen:"https://m.media-amazon.com/images/I/61Q8Z6F9JLL._AC_UF1000,1000_QL80_.jpg",
descripcion:"Fresco, moderno y elegante."
}


];






const productosHTML =
document.getElementById("productos");






function mostrarProductos(lista = perfumes){


productosHTML.innerHTML = "";



lista.forEach(p => {



productosHTML.innerHTML += `


<div class="card">


<img src="${p.imagen}">



<h2>

${p.nombre}

</h2>



<p>

${p.descripcion}

</p>



<div class="precio">

$${p.precio.toLocaleString("es-AR")}

</div>



</div>


`;



});


}







mostrarProductos();







// BUSCADOR


document
.getElementById("buscar")
.addEventListener("input", function(){



let texto = this.value.toLowerCase();



let resultado = perfumes.filter(p =>


p.nombre
.toLowerCase()
.includes(texto)


);



mostrarProductos(resultado);



});



</script>


</body>

</html>
