rgba(0,0,0,.9)

.buscador{

text-align:center;

padding:40px;

}

width:60%;

padding:18px;

border-radius:30px;

border:none;

font-size:18px;

}





/* TITULO */


.titulo{

text-align:center;

font-size:45px;

color:#d4af37;

margin:40px;

}




/* PRODUCTOS */


.productos{


display:grid;

grid-template-columns:

repeat(auto-fit,minmax(280px,1fr));


gap:30px;

padding:40px;

}




.card{

background:#151515;

border-radius:20px;

overflow:hidden;

text-align:center;

padding-bottom:25px;

transition:.4s;

}



.card:hover{

transform:translateY(-10px);

box-shadow:0 0 25px #d4af37;

}





.card img{

width:100%;

height:320px;

object-fit:cover;

}





.card h2{

color:#d4af37;

margin:15px;

}



.card p{

color:#ccc;

padding:10px;

}



.precio{

font-size:28px;

color:#00c853;

margin:15px;

}

function mostrarProductos(lista = perfumes){


productosHTML.innerHTML = "";



lista.forEach(p => {



productosHTML.innerHTML += `


<div class="card">


<img src="${p.imagen}">



<h2>

${p.nombre}

</h2>



<p>

${p.descripcion}

</p>



<div class="precio">

$${p.precio.toLocaleString("es-AR")}

</div>



</div>


`;



});


}
