<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Perfumes Ciro</title>


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, Helvetica, sans-serif;
}


body{

background:#080808;
color:white;

}


/* HEADER */


header{

height:90px;

background:#050505;

display:flex;

align-items:center;

justify-content:space-between;

padding:20px 60px;

position:sticky;

top:0;

z-index:1000;

box-shadow:0 0 20px black;

}



.logo{

font-size:35px;

font-weight:bold;

}


.logo span{

color:#d4af37;

}



nav a{

color:white;

text-decoration:none;

margin:15px;

font-size:18px;

}



nav a:hover{

color:#d4af37;

}



.carrito-icono{

font-size:30px;

cursor:pointer;

position:relative;

}



#contador{

position:absolute;

background:#00c853;

border-radius:50%;

padding:4px 9px;

font-size:13px;

top:-15px;

right:-15px;

}





/* HERO */


.hero{

height:550px;


background:

linear-gradient(
rgba(0,0,0,.5),
rgba(0,0,0,.9)
),

url("https://images.unsplash.com/photo-1541643600914-78b084683601");


background-size:cover;

background-position:center;

display:flex;

align-items:center;

padding:60px;

}



.hero h1{

font-size:75px;

color:#d4af37;

text-shadow:0 0 25px #d4af37;

}



.hero p{

font-size:25px;

margin:25px 0;

}




.btn{

background:#00c853;

border:none;

color:white;

padding:15px 35px;

border-radius:30px;

font-size:18px;

cursor:pointer;

transition:.3s;

}



.btn:hover{

background:#00e676;

transform:scale(1.05);

}





/* BUSCADOR */


.buscador{

text-align:center;

padding:40px;

}



.buscador input{

width:60%;

padding:18px;

border-radius:30px;

border:none;

font-size:18px;

}





/* PRODUCTOS */


.titulo{

text-align:center;

font-size:45px;

color:#d4af37;

margin:40px;

}




.productos{


display:grid;

grid-template-columns:

repeat(auto-fit,minmax(280px,1fr));


gap:30px;

padding:40px;

}




.card{

background:#151515;

border-radius:20px;

overflow:hidden;

text-align:center;

padding-bottom:25px;

transition:.4s;

}



.card:hover{

transform:translateY(-10px);

box-shadow:0 0 25px #d4af37;

}




.card img{

width:100%;

height:320px;

object-fit:cover;

}



.card h2{

color:#d4af37;

margin:15px;

}



.card p{

color:#ccc;

padding:10px;

}



.precio{

font-size:28px;

color:#00c853;

margin:15px;

}


.favorito{

background:none;

border:none;

font-size:30px;

cursor:pointer;

}

</style>


</head>



<body>


<header>


<div class="logo">

PERFUMES <span>CIRO</span>

</div>



<nav>

<a href="#">Inicio</a>

<a href="#productos">Perfumes</a>

<a href="#reseñas">Reseñas</a>

</nav>



<div class="carrito-icono" onclick="abrirCarrito()">

<i class="fa-solid fa-cart-shopping"></i>

<span id="contador">

0

</span>

</div>


</header>





<section class="hero">


<div>


<h1>

PERFUMES CIRO

</h1>


<p>

Perfumes árabes premium con esencia oriental.

</p>


<button class="btn">

Comprar ahora

</button>


</div>


</section>




<div class="buscador">


<input id="buscar"

placeholder="Buscar perfume...">


</div>





<h2 class="titulo">

Nuestros perfumes

</h2>



<section class="productos" id="productos">


</section><!-- ==========================
        CARRITO
========================== -->


<div class="carrito-panel" id="carrito">


<div class="carrito-titulo">

<h2>

🛒 Mi carrito

</h2>


<button onclick="cerrarCarrito()">

X

</button>


</div>



<div id="listaCarrito">

</div>



<div class="total">

<h2>

Total:

<span id="total">

$0

</span>

</h2>


<button class="btn" onclick="abrirCompra()">

Comprar

</button>


</div>


</div>







<!-- ==========================
        FAVORITOS
========================== -->


<section class="favoritos">


<h2 class="titulo">

❤️ Favoritos

</h2>


<div id="listaFavoritos">

<p>

No tienes favoritos todavía.

</p>


</div>


</section>







<!-- ==========================
        RESEÑAS
========================== -->


<section id="reseñas">


<h2 class="titulo">

⭐ Reseñas de clientes

</h2>




<div class="formulario">


<input id="nombre"

placeholder="Tu nombre">



<select id="estrellas">


<option>

⭐⭐⭐⭐⭐

</option>


<option>

⭐⭐⭐⭐

</option>


<option>

⭐⭐⭐

</option>


<option>

⭐⭐

</option>


<option>

⭐

</option>



</select>



<textarea id="comentario"

placeholder="Escribe tu experiencia">

</textarea>



<button class="btn"

onclick="agregarResena()">

Publicar reseña

</button>



</div>




<div id="resenas">

</div>


</section>







<!-- ==========================
        COMPRA
========================== -->


<div class="modal" id="modalCompra">


<div class="modal-contenido">


<h2>

Finalizar compra

</h2>


<input placeholder="Nombre completo">


<input placeholder="Dirección">


<input placeholder="Número de teléfono">



<button class="btn">

Confirmar pedido

</button>



<button onclick="cerrarCompra()">

Cerrar

</button>


</div>


</div>







<style>


/* CARRITO */


.carrito-panel{


position:fixed;

right:-450px;

top:0;

width:420px;

height:100vh;

background:white;

color:black;

z-index:2000;

transition:.5s;

overflow:auto;


}



.carrito-panel.activo{

right:0;

}



.carrito-titulo{


background:#00c853;

color:white;

padding:25px;

display:flex;

justify-content:space-between;


}



.carrito-titulo button{


background:red;

color:white;

border:none;

padding:10px;

cursor:pointer;

}




.item-carrito{


display:flex;

gap:15px;

padding:20px;

border-bottom:1px solid #ddd;

}



.item-carrito img{


width:90px;

height:90px;

object-fit:cover;

border-radius:10px;


}



.item-carrito button{


padding:5px 10px;

margin:5px;

cursor:pointer;

}




.total{


padding:25px;

color:#00c853;

}







/* FAVORITOS */


.favoritos{


padding:40px;

}



#listaFavoritos{


display:flex;

justify-content:center;

gap:20px;

flex-wrap:wrap;


}







/* FORMULARIO */


.formulario{


width:400px;

margin:auto;

display:flex;

flex-direction:column;

gap:15px;


}



.formulario input,
.formulario textarea,
.formulario select{


padding:15px;

border-radius:10px;

border:none;

font-size:16px;


}





.review{


background:#151515;

padding:25px;

margin:20px auto;

width:80%;

border-radius:20px;


}








/* MODAL */


.modal{


display:none;

position:fixed;

top:0;

left:0;

width:100%;

height:100%;


background:rgba(0,0,0,.8);


justify-content:center;

align-items:center;


z-index:3000;


}



.modal-contenido{


background:white;

color:black;

padding:40px;

border-radius:20px;

display:flex;

flex-direction:column;

gap:15px;

width:350px;


}



.modal-contenido input{


padding:15px;


}




@media(max-width:700px){


header{

padding:20px;

}


nav{

display:none;

}



.hero h1{

font-size:45px;

}



.carrito-panel{

width:100%;

}


.formulario{

width:90%;

}



}

</style><script>


// ===============================
// PRODUCTOS
// ===============================


const perfumes = [


{
id:1,
nombre:"Lattafa Khamrah",
precio:35000,
imagen:"https://m.media-amazon.com/images/I/61J4LqfM5nL._AC_UF1000,1000_QL80_.jpg",
descripcion:"Vainilla, canela y ámbar. Aroma dulce y elegante."
},



{
id:2,
nombre:"Lattafa Asad",
precio:32000,
imagen:"https://m.media-amazon.com/images/I/61Yk3vP5Y9L._AC_UF1000,1000_QL80_.jpg",
descripcion:"Perfume intenso con especias y madera."
},



{
id:3,
nombre:"Yara Lattafa",
precio:30000,
imagen:"https://m.media-amazon.com/images/I/71n7b8HqRGL._AC_UF1000,1000_QL80_.jpg",
descripcion:"Fragancia femenina con notas dulces."
},



{
id:4,
nombre:"Oud For Glory",
precio:42000,
imagen:"https://m.media-amazon.com/images/I/61kYxQ8X7mL._AC_UF1000,1000_QL80_.jpg",
descripcion:"Aroma oriental con oud y especias."
},



{
id:5,
nombre:"Fakhar Black",
precio:31000,
imagen:"https://m.media-amazon.com/images/I/61Q8Z6F9JLL._AC_UF1000,1000_QL80_.jpg",
descripcion:"Fresco, moderno y elegante."
}



];





let carrito =
JSON.parse(localStorage.getItem("carrito"))
|| [];



let favoritos =
JSON.parse(localStorage.getItem("favoritos"))
|| [];







// ELEMENTOS


const productosHTML =
document.getElementById("productos");


const contador =
document.getElementById("contador");


const listaCarrito =
document.getElementById("listaCarrito");


const total =
document.getElementById("total");









// MOSTRAR PRODUCTOS


function mostrarProductos(lista=perfumes){


productosHTML.innerHTML="";



lista.forEach(p=>{


productosHTML.innerHTML += `



<div class="card">


<img src="${p.imagen}">



<button class="favorito"
onclick="agregarFavorito(${p.id})">

❤️

</button>



<h2>

${p.nombre}

</h2>



<p>

${p.descripcion}

</p>



<div class="precio">

$${p.precio.toLocaleString()}

</div>



<button class="btn"

onclick="agregarCarrito(${p.id})">

🛒 Añadir al carrito

</button>



</div>


`;



});


}



mostrarProductos();








// ===============================
// CARRITO
// ===============================



function agregarCarrito(id){


let producto =
perfumes.find(p=>p.id===id);



let existe =
carrito.find(p=>p.id===id);



if(existe){


existe.cantidad++;


}else{


carrito.push({

...producto,

cantidad:1

});


}



guardar();

mostrarCarrito();


}







function mostrarCarrito(){


listaCarrito.innerHTML="";


let suma=0;



carrito.forEach(p=>{


suma += p.precio*p.cantidad;



listaCarrito.innerHTML += `


<div class="item-carrito">


<img src="${p.imagen}">



<div>


<h3>

${p.nombre}

</h3>



<p>

$${p.precio}

</p>



<button onclick="menos(${p.id})">

-

</button>



${p.cantidad}



<button onclick="mas(${p.id})">

+

</button>



<button onclick="eliminar(${p.id})">

🗑

</button>


</div>


</div>


`;


});



total.innerHTML =
"$"+suma.toLocaleString();



contador.innerHTML =
carrito.reduce(
(a,b)=>a+b.cantidad,
0
);



}







function mas(id){


let p =
carrito.find(x=>x.id===id);


p.cantidad++;


guardar();

mostrarCarrito();


}





function menos(id){


let p =
carrito.find(x=>x.id===id);


if(p.cantidad>1){

p.cantidad--;

}

else{

eliminar(id);

}



guardar();

mostrarCarrito();


}







function eliminar(id){


carrito =
carrito.filter(
p=>p.id!==id
);


guardar();

mostrarCarrito();


}







function guardar(){


localStorage.setItem(

"carrito",

JSON.stringify(carrito)

);


localStorage.setItem(

"favoritos",

JSON.stringify(favoritos)

);


}






mostrarCarrito();





// ===============================
// ABRIR CERRAR CARRITO
// ===============================


function abrirCarrito(){


document
.getElementById("carrito")
.classList.add("activo");


}



function cerrarCarrito(){


document
.getElementById("carrito")
.classList.remove("activo");


}







// ===============================
// BUSCADOR
// ===============================



document
.getElementById("buscar")
.addEventListener("input",function(){


let texto =
this.value.toLowerCase();



let resultado =
perfumes.filter(p=>

p.nombre.toLowerCase()
.includes(texto)

);



mostrarProductos(resultado);



});









// ===============================
// FAVORITOS
// ===============================


function agregarFavorito(id){


let p =
perfumes.find(x=>x.id===id);



if(!favoritos.includes(p)){


favoritos.push(p);


}



mostrarFavoritos();

guardar();


}



function mostrarFavoritos(){


let caja =
document.getElementById("listaFavoritos");


caja.innerHTML="";



if(favoritos.length===0){


caja.innerHTML=
"No tienes favoritos";


return;


}



favoritos.forEach(p=>{


caja.innerHTML+=`


<div class="card">


<img src="${p.imagen}">


<h2>${p.nombre}</h2>


</div>


`;


});


}



mostrarFavoritos();





</script><script>


// ===============================
// RESEÑAS
// ===============================


function agregarResena(){


let nombre =
document.getElementById("nombre").value;


let estrellas =
document.getElementById("estrellas").value;


let mensaje =
document.getElementById("comentario").value;



if(nombre==="" || mensaje===""){


alert("Completa todos los campos");

return;


}




let reseñas =
JSON.parse(localStorage.getItem("reseñas"))
|| [];



reseñas.push({

nombre:nombre,

estrellas:estrellas,

mensaje:mensaje

});



localStorage.setItem(

"reseñas",

JSON.stringify(reseñas)

);



mostrarReseñas();



document.getElementById("nombre").value="";

document.getElementById("comentario").value="";



}




function mostrarReseñas(){


let caja =
document.getElementById("resenas");



caja.innerHTML="";



let reseñas =
JSON.parse(localStorage.getItem("reseñas"))
|| [];



reseñas.forEach(r=>{


caja.innerHTML+=`


<div class="review">


<h3>

${r.estrellas}

</h3>



<p>

"${r.mensaje}"

</p>



<b>

${r.nombre}

</b>



</div>


`;


});



}



mostrarReseñas();






// ===============================
// COMPRA
// ===============================



function abrirCompra(){


document
.getElementById("modalCompra")
.style.display="flex";


}



function cerrarCompra(){


document
.getElementById("modalCompra")
.style.display="none";


}







</script>





<style>


/* ANIMACIONES FINALES */


.card,
.review,
.btn{

animation:aparecer .5s ease;

}



@keyframes aparecer{


from{

opacity:0;

transform:translateY(20px);

}


to{

opacity:1;

transform:translateY(0);

}


}





/* MEJORAS MOVIL */


@media(max-width:700px){



.logo{

font-size:25px;

}



.hero{

padding:30px;

}



.hero h1{

font-size:45px;

}



.buscador input{

width:90%;

}



.titulo{

font-size:35px;

}



}




/* FOOTER */


footer{

background:#050505;

text-align:center;

padding:50px;

margin-top:60px;

}


footer h2{

color:#d4af37;

}



.redes{

font-size:35px;

display:flex;

justify-content:center;

gap:30px;

margin-top:20px;

}




</style>





<footer>


<h2>

PERFUMES CIRO

</h2>


<p>

Perfumes árabes premium

</p>



<div class="redes">


<i class="fa-brands fa-instagram"></i>


<i class="fa-brands fa-whatsapp"></i>


<i class="fa-brands fa-tiktok"></i>


</div>


</footer>




</body>

</html>
